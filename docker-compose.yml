version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: app-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gator
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/home/boss/bootdev/docker-volumes/gator-psql

volumes:
  postgres_data:

